name: BAMBU site quality
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-site-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out website
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate HTML structure and internal links
        run: python3 tools/audit_site.py
      - name: Check JavaScript syntax
        run: |
          node --check site.js
          node --check planning-tools.js
          node --check reveal.js
          node --check brand-opening.js
          node --check strategy-design.js
          node --check bambu-editorial-interactions.js

  browser-checks:
    needs: static-site-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BAMBU_CHROMIUM: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test dependencies
        run: |
          pip install playwright==1.56.0
          "$BAMBU_CHROMIUM" --version
      - name: Test layouts, navigation, design controls and forms
        run: python tools/test_layouts.py
      - name: Verify published site
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
        env:
          BAMBU_TEST_URL: https://bambuinteriors.co.uk/
          BAMBU_SCREENSHOTS: ${{ runner.temp }}/bambu-screenshots
        run: |
          python tools/check_deployment.py
          python tools/test_layouts.py
      - name: Keep responsive review images
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: responsive-review
          path: ${{ runner.temp }}/bambu-screenshots
          if-no-files-found: ignore
          retention-days: 7
