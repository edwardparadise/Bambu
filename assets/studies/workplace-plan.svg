<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="plan-title plan-desc">
<title id="plan-title">Illustrative workplace floorplate with 12 workstations, meeting rooms, focus rooms, arrival and breakout space</title>
<desc id="plan-desc">A conceptual diagram showing zones, furniture positions and a main circulation route. Workstations are approximately 1400 by 800 millimetres, with suggested 1500 millimetre circulation. This is not a measured or regulatory-compliant design.</desc>
<defs>
<pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" stroke="#c8c9bf" stroke-width=".7" fill="none"/></pattern>
<pattern id="glass" width="9" height="9" patternUnits="userSpaceOnUse"><path d="M0 9 9 0" stroke="#b7d0d3" stroke-width=".7"/></pattern>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse"><path d="M0 0 8 4 0 8Z" fill="#367e88"/></marker>
</defs>
